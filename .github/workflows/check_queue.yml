name: Check Passport Queue

on:
  schedule:
    # Запуск кожні 5 хвилин
    - cron: '*/5 * * * *'
  workflow_dispatch: # Ручний запуск у будь-який час

jobs:
  check-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Queue Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python check_queue.py

      - name: Upload screenshots (debug or alert)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-screenshots
          path: |
            slot_alert.png
            debug_screen.png
          if-no-files-found: ignore
